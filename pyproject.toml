[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cuvis-ai-rfdetr"
version = "0.5.1"
description = "RF-DETR (Roboflow, Apache-2.0 tier) object detection as a cuvis.ai plugin node."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Cubert GmbH, Ulm, Germany", email = "cuvis.ai@cubert-gmbh.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Operating System :: OS Independent",
]
keywords = [
    "cuvis",
    "hyperspectral",
    "rf-detr",
    "object-detection",
    "foreign-object-detection",
    "anomaly-detection",
    "plugin",
    "cuvis-ai",
]
dependencies = [
    # Note: do NOT depend on the high-level `cuvis-ai` package — plugins target
    # cuvis-ai-core + cuvis-ai-schemas only (matching the sibling plugins).
    "cuvis-ai-core>=0.11.2",
    "cuvis-ai-schemas>=0.8.0",
    # Official Roboflow RF-DETR, core (inference) tier only — deliberately NOT
    # rfdetr[train]; fine-tuning happens outside the pipeline graph.
    "rfdetr>=1.8,<2",
    "torch>=2.2",
    "numpy",
    "scipy>=1.10",
    "supervision>=0.29",
    # JPEG round-trip helper (functional.jpeg_roundtrip); pin the exact Pillow
    # version in your lockfile when byte-exact JPEG reproduction is required.
    "pillow>=10",
]

[project.optional-dependencies]
train = ["rfdetr[train]>=1.8,<2"]
# TensorRT backend of RFDETRSegmenter (backend="tensorrt"). The wheel follows torch's CUDA: cu13 on
# Linux aarch64 (Jetson Thor), cu12 on Windows / Linux x86_64. TensorRT 10: TensorRT 11 dropped the FP16
# builder flag. Engines are tied to the TensorRT version, so a different version means rebuilding them.
# onnx is only needed to build engines.
tensorrt = [
    "tensorrt-cu13==10.15.1.29; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "tensorrt-cu12==10.15.1.29; sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "onnx>=1.16,<2",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy",
    "bandit",
    "detect-secrets",
    "pip-audit",
    "twine>=6.2.0",
]

[project.urls]
Homepage = "https://www.cubert-hyperspectral.com/"
Repository = "https://github.com/cubert-hyperspectral/cuvis-ai-rfdetr"
Issues = "https://github.com/cubert-hyperspectral/cuvis-ai-rfdetr/issues"

[tool.setuptools.packages.find]
include = ["cuvis_ai_rfdetr*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Allows running the tests from a fresh checkout without installing the
# package (the suite needs only cuvis-ai-core, cuvis-ai-schemas and torch).
pythonpath = ["."]
markers = [
    "integration: exercises the cuvis-ai-core plugin loader",
    "slow: GPU / rfdetr-dependent smoke tests (excluded in CI via -m 'not slow')",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests", "examples", "build", "dist"]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101"]

[tool.coverage.run]
source = ["cuvis_ai_rfdetr"]
branch = true
# transforms.py imports cuvis-ai-augment, which is git-tag-released and not installed in CI,
# so it cannot be imported there; its tests (tests/test_transforms.py,
# tests/test_fair_transforms.py) run where augment is installed.
omit = ["cuvis_ai_rfdetr/transforms.py"]

[tool.coverage.report]
show_missing = true
